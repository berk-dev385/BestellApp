<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BurgerHouse</title>

    <link rel="icon" href="favicon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Bereitet die Verbindung zum Google-Fonts-Stylesheet vor. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bereitet die Verbindung zum Server mit den eigentlichen Schriftdateien vor. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Palanquin:wght@400;500;600;700&family=Palanquin+Dark:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bindet beide Schriftfamilien mit den benötigten Schriftstärken ein. -->

    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/basket.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>

  <body>
    <div class="app-shell mx-auto">
      <!-- Erstellt einen horizontal zentrierten Seitenrahmen. -->

      <header
        class="site-header d-flex align-items-center justify-content-between"
      >
        <!-- Erstellt die Kopfzeile und richtet ihre Inhalte mit Bootstrap-Flexbox aus. -->
        <img
          class="brand-symbol"
          src="assets/icons/header-logo.svg"
          alt="Bestell App"
        />
        <!-- Bindet das Markenlogo ein. -->

        <img class="desktop-menu-icon" src="assets/icons/menu.svg" alt="" />
        <!-- Bindet das dekorative Menüsymbol ein. -->
      </header>

      <section class="hero-section" id="top">
        <!-- Erstellt den Bereich für die Restaurantpräsentation. -->

        <div class="hero-image-wrap">
          <!-- Gruppiert das Restaurantfoto und das Restaurantlogo. -->

          <img
            class="restaurant-hero"
            src="assets/images/hero.webp"
            alt="Burger, Pizza und Gerichte"
          />
          <!-- Bindet das große Restaurantfoto ein. -->

          <img
            class="restaurant-logo"
            src="assets/images/logo-burger.png"
            alt="BurgerHouse Logo"
          />
          <!-- Bindet das Restaurantlogo ein. -->
        </div>
        <!-- Beendet den gemeinsamen Bildcontainer. -->

        <div class="restaurant-details text-center">
          <!-- Fasst sämtliche Restaurantinformationen zusammen und zentriert den Text. -->

          <div
            class="restaurant-name-row d-flex align-items-center justify-content-center"
          >
            <!-- Ordnet Restaurantname und Bewertung nebeneinander und mittig an. -->

            <h1><span>Burger</span>House</h1>
            <!-- Definiert die wichtigste inhaltliche Überschrift unserer Webseite. -->
            <!-- Der Span trennt "Burger" farblich von House innerhalb derselben Überschrift. -->

            <span class="rating d-inline-flex align-items-center">
              <!-- Gruppiert den Stern und die Bewertungszahlen in einem Flex-Container. -->

              <img
                src="assets/icons/star.svg"
                alt="Rating"
                width="24"
                height="24"
              />
              <!-- Bindet den Bewertungsstern mit einer Größe von 24 mal 24 Pixeln ein. -->

              <strong>4,1</strong>
              <!-- Hebt die durchschnittliche Bewertung inhaltlich hervor. -->

              <span>(317)</span>
              <!-- Zeigt die Anzahl der abgegebenen Bewertungen an. -->
            </span>
            <!-- Beendet die gemeinsame Bewertungsgruppe. -->
          </div>
          <!-- Beendet die Zeile mit dem Restaurantnamen und der Bewertung. -->

          <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
          <!-- Beschreibt das kulinarische Angebot des Restaurants. -->

          <p class="delivery-info">Delivery fee: 4,99€</p>
          <!-- Informiert über die festgelegte Liefergebühr. -->
        </div>
        <!-- Beendet den gesamten Informationsbereich des Restaurants. -->
      </section>
      <!-- HERO_END -->
    </div>
    <!-- SHELL_END -->

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- Lädt die Bootstrap-Funktionalitäten. -->
    <script src="scripts/db.js"></script>
    <!-- Lädt später die Gerichtedaten. -->
    <script src="scripts/templates.js"></script>
    <!-- Lädt später die HTML-Vorlagen. -->
    <script src="scripts/script.js"></script>
    <!-- Lädt zuletzt die Anwendungslogik. -->
  </body>
</html>
